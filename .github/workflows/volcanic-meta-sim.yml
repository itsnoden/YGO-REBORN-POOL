name: Volcanic Meta Sim

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/volcanic-meta-sim.yml'
      - 'solver/reborn/named_meta_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: solver
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Build pinned ocgcore
        run: python -m reborn.build_core --core vendor/core --output build --jobs 2

      - name: Reconcile pinned simulator IDs
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Run Volcanic vs named meta paired-seat stress test
        run: |
          set -o pipefail
          python -m reborn.named_meta_eval \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --train-games 64 \
            --train-decks 8 \
            --seeds-per-matchup 4 \
            --budget 5000 \
            --train-seed 351000 \
            --eval-seed 361000 \
            --policy-seed 20260913 \
            2>&1 | tee reports/ci_volcanic_meta_sim.log

      - name: Upload Volcanic meta sim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volcanic-meta-sim-${{ github.sha }}
          path: |
            solver/reports/volcanic_meta_sim.json
            solver/reports/ci_volcanic_meta_sim.log
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
