name: Text Difference Audit

on:
  push:
    branches: [main]
    paths:
      - 'solver/reborn/text_audit.py'
      - 'solver/tests/test_text_audit.py'
      - 'solver/reborn/engine_bridge.py'
      - 'solver/reborn/verified_data.py'
      - 'solver/data/identity_aliases.json'
      - 'solver/data/shared_identity_aliases.json'
      - 'solver/data/source_corrections.json'
      - 'solver/data/nonstandard_cards.json'
      - 'solver/data/verified_official_records.json'
      - 'solver/data/verified_alias_official_records.json'
      - '.github/workflows/text-difference-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: solver
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Reconcile pinned simulator IDs and texts
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Run text audit unit tests
        run: python -m unittest discover -s tests -p 'test_text_audit.py' -v

      - name: Prioritize text differences
        run: |
          set -o pipefail
          python -m reborn.text_audit 2>&1 | tee reports/ci_text_difference_audit.log

      - name: Upload text audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-difference-audit-${{ github.sha }}
          path: |
            solver/reports/text_difference_audit.json
            solver/reports/ci_text_difference_audit.log
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
