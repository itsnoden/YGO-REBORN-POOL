name: Structural Challenger Screen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/structural-challenger-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

# Rerun after learned large select-card factorization.

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solver
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Build pinned ocgcore
        run: python -m reborn.build_core --core vendor/core --output build --jobs 2

      - name: Reconcile pinned simulator IDs
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Test structural mutations
        run: python -m unittest tests.test_structural_mutation -v

      - name: Run structural challenger screen
        run: |
          set -o pipefail
          python -m reborn.structural_challenger_screen \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --policy canonical \
            --train-games 64 \
            --train-decks 8 \
            --adversaries 4 \
            --challengers 6 \
            --seeds-per-opponent 2 \
            --budget 5000 \
            --train-seed 351000 \
            --eval-seed 361000 \
            --policy-seed 20260911 \
            --mutation-seed 20260911 \
            2>&1 | tee reports/ci_structural_challenger_screen.log

      - name: Upload structural challenger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-challenger-screen-${{ github.sha }}
          path: |
            solver/reports/structural_challenger_screen.json
            solver/reports/ci_structural_challenger_screen.log
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
