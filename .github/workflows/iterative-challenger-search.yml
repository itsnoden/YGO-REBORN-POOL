name: Iterative Challenger Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iterative-challenger-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solver
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Build pinned ocgcore
        run: python -m reborn.build_core --core vendor/core --output build --jobs 2

      - name: Reconcile pinned simulator IDs
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Test iterative challenger selection
        run: python -m unittest tests.test_iterative_challenger_search -v

      - name: Run two-round exploratory adversarial search
        run: |
          set -o pipefail
          python -m reborn.iterative_challenger_search \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --policy canonical \
            --train-games 64 \
            --train-decks 8 \
            --initial-population 4 \
            --rounds 2 \
            --challengers-per-round 4 \
            --seeds-per-opponent 2 \
            --budget 5000 \
            --train-seed 471000 \
            --eval-seed 481000 \
            --policy-seed 20260911 \
            --mutation-seed 20260911 \
            2>&1 | tee reports/ci_iterative_challenger_search.log

      - name: Upload iterative search report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iterative-challenger-search-${{ github.sha }}
          path: |
            solver/reports/iterative_challenger_search.json
            solver/reports/ci_iterative_challenger_search.log
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
