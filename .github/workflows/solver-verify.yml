name: Solver Verify

on:
  push:
    branches: [main]
    paths:
      - 'solver/**'
      - '.github/workflows/solver-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'solver/**'
      - '.github/workflows/solver-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Build pinned ocgcore
        run: python -m reborn.build_core --core vendor/core --output build --jobs 2

      - name: Reconcile pinned simulator IDs
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Run unit tests
        run: python -m unittest discover -s tests -v 2>&1 | tee reports/ci_unit_tests.log

      - name: Run strict duel-flow probe
        run: |
          python -m reborn.flow_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --count 8 \
            --budget 5000 \
            --seed 3000 \
            2>&1 | tee reports/ci_flow_probe.log

      - name: Capture pinned dependency heads
        if: always()
        run: |
          {
            echo "core $(git -C vendor/core rev-parse HEAD 2>/dev/null || true)"
            echo "scripts $(git -C vendor/scripts rev-parse HEAD 2>/dev/null || true)"
            echo "database $(git -C vendor/database rev-parse HEAD 2>/dev/null || true)"
          } > reports/ci_dependency_heads.txt

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-verification-${{ github.sha }}
          path: |
            solver/reports/flow_probe.json
            solver/reports/ci_flow_probe.log
            solver/reports/ci_unit_tests.log
            solver/reports/ci_dependency_heads.txt
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
