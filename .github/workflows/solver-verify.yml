name: Solver Verify

on:
  push:
    branches: [main]
    paths:
      - 'solver/**'
      - '.github/workflows/solver-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'solver/**'
      - '.github/workflows/solver-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: solver
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild pinned engine dependencies
        run: python -m reborn.bootstrap_engine

      - name: Build pinned ocgcore
        run: python -m reborn.build_core --core vendor/core --output build --jobs 2

      - name: Reconcile pinned simulator IDs
        run: python -m reborn.engine_bridge --database vendor/database/cards.cdb --scripts vendor/scripts --core vendor/core

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/ci_unit_tests.log

      - name: Run strict duel-flow probe
        run: |
          set -o pipefail
          python -m reborn.flow_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --count 8 \
            --budget 5000 \
            --seed 3000 \
            2>&1 | tee reports/ci_flow_probe.log

      - name: Run paired stochastic pilot probe
        run: |
          set -o pipefail
          python -m reborn.pilot_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --pairs 4 \
            --budget 5000 \
            --seed 5000 \
            2>&1 | tee reports/ci_pilot_probe.log

      - name: Verify deterministic response-history replay
        run: |
          set -o pipefail
          python -m reborn.replay_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --count 2 \
            --budget 5000 \
            --seed 52000 \
            2>&1 | tee reports/ci_replay_probe.log

      - name: Verify divergent counterfactual branch replay
        run: |
          set -o pipefail
          python -m reborn.counterfactual_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --budget 5000 \
            --seed 53000 \
            2>&1 | tee reports/ci_counterfactual_probe.log

      - name: Run offline counterfactual training smoke probe
        run: |
          set -o pipefail
          python -m reborn.counterfactual_train_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --budget 5000 \
            --seed 54000 \
            --targets 2 \
            --max-options 3 \
            --rollouts 3 \
            --continuation-seed 64000 \
            --policy-seed 20260907 \
            2>&1 | tee reports/ci_counterfactual_train_probe.log

      - name: Run from-scratch learning smoke probe
        run: |
          set -o pipefail
          python -m reborn.learn_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --games 8 \
            --budget 5000 \
            --seed 7000 \
            --policy-seed 20260906 \
            2>&1 | tee reports/ci_learn_probe.log

      - name: Run deterministic held-out crash diagnostic
        run: |
          set -o pipefail
          python -m reborn.crash_probe \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            2>&1 | tee reports/ci_crash_probe.log

      - name: Run held-out pilot skill evaluation
        run: |
          set -o pipefail
          python -m reborn.pilot_eval \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --train-games 16 \
            --train-decks 4 \
            --eval-decks 2 \
            --pairs-per-deck 2 \
            --budget 5000 \
            --train-seed 11000 \
            --eval-seed 21000 \
            --policy-seed 20260906 \
            2>&1 | tee reports/ci_pilot_eval.log

      - name: Run multi-block held-out pilot benchmark
        run: |
          set -o pipefail
          python -m reborn.pilot_benchmark \
            --library build/libocgcore.so \
            --database vendor/database/cards.cdb \
            --scripts vendor/scripts \
            --blocks 3 \
            --train-games 16 \
            --train-decks 4 \
            --eval-decks 2 \
            --pairs-per-deck 6 \
            --budget 5000 \
            --train-seed 31000 \
            --eval-seed 41000 \
            --policy-seed 20260907 \
            2>&1 | tee reports/ci_pilot_benchmark.log

      - name: Capture pinned dependency heads
        if: always()
        run: |
          {
            echo "core $(git -C vendor/core rev-parse HEAD 2>/dev/null || true)"
            echo "scripts $(git -C vendor/scripts rev-parse HEAD 2>/dev/null || true)"
            echo "database $(git -C vendor/database rev-parse HEAD 2>/dev/null || true)"
          } > reports/ci_dependency_heads.txt

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-verification-${{ github.sha }}
          path: |
            solver/reports/flow_probe.json
            solver/reports/pilot_probe.json
            solver/reports/replay_probe.json
            solver/reports/counterfactual_probe.json
            solver/reports/counterfactual_train_probe.json
            solver/reports/counterfactual_policy_smoke.json
            solver/reports/learn_probe.json
            solver/reports/crash_probe.json
            solver/reports/pilot_eval.json
            solver/reports/pilot_benchmark.json
            solver/reports/learned_policy_reborn_smoke.json
            solver/reports/heldout_policy_reborn.json
            solver/reports/ci_flow_probe.log
            solver/reports/ci_pilot_probe.log
            solver/reports/ci_replay_probe.log
            solver/reports/ci_counterfactual_probe.log
            solver/reports/ci_counterfactual_train_probe.log
            solver/reports/ci_learn_probe.log
            solver/reports/ci_crash_probe.log
            solver/reports/ci_pilot_eval.log
            solver/reports/ci_pilot_benchmark.log
            solver/reports/ci_unit_tests.log
            solver/reports/ci_dependency_heads.txt
            solver/reports/engine_coverage.json
          if-no-files-found: warn
          retention-days: 14
